<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conjuntos | GIORNNO</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>


    <!-- HEADER -->

    <header>

        <a href="../index.html" class="logo">

            <img src="../img/logo1.png" alt="GIORNNO">

        </a>


        <nav>

            <a href="../index.html">INÍCIO</a>

            <a href="aneis.html">ANÉIS</a>

            <a href="colares.html">COLARES</a>

            <a href="brincos.html">BRINCOS</a>

            <a href="pulseiras.html">PULSEIRAS</a>

            <a href="conjuntos.html">CONJUNTOS</a>

        </nav>

    </header>


    <!-- TÍTULO DA CATEGORIA -->

    <section class="catalog-header">

        <p>GIORNNO JOIAS</p>

        <h2>CONJUNTOS</h2>

        <span></span>

    </section>


    <!-- FILTRO -->

    <div class="catalog-filter-container">

        <button
            class="filter-icon"
            id="filterToggle"
            aria-label="Filtrar produtos">

            <svg viewBox="0 0 24 24" aria-hidden="true">

                <line x1="4" y1="6" x2="20" y2="6"></line>
                <circle cx="9" cy="6" r="1.5"></circle>

                <line x1="4" y1="12" x2="20" y2="12"></line>
                <circle cx="15" cy="12" r="1.5"></circle>

                <line x1="4" y1="18" x2="20" y2="18"></line>
                <circle cx="11" cy="18" r="1.5"></circle>

            </svg>

        </button>


        <div class="filter-menu" id="filterMenu">

            <button
                class="filter-option active"
                data-filter="all">

                TODOS

            </button>


            <button
                class="filter-option"
                data-filter="available">

                DISPONÍVEIS

            </button>


            <button
                class="filter-option"
                data-filter="sold">

                INDISPONÍVEIS

            </button>

        </div>

    </div>


    <!-- CATÁLOGO -->

    <main class="catalog">

        <div class="product-grid">


            <!-- PRODUTO 1 -->

            <article class="product-card available">

                <div class="product-image">

                    <img
                        src="../img-conjuntos/conjunto1.png"
                        alt="Conjunto GIORNNO Ref. 3364">

                </div>


                <div class="product-details">

                    <p class="product-code">

                        Ref. 3364

                    </p>


                    <p class="price">

                        R$ 159,90

                    </p>

                </div>

            </article>


            <!-- PRODUTO 2 -->

            <article class="product-card available">

                <div class="product-image">

                    <img
                        src="../img-conjuntos/conjunto2.png"
                        alt="Conjunto GIORNNO Ref. 2017">

                </div>


                <div class="product-details">

                    <p class="product-code">

                        Ref. 2017

                    </p>


                    <p class="price">

                        R$ 169,90

                    </p>

                </div>

            </article>


            <!-- PRODUTO 3 -->

            <article class="product-card available sold">

                                <div class="product-image">

                    <img src="../img-conjuntos/conjunto3.png"
                         alt="Brinco GIORNNO Ref. 000">

                    <div class="sold-overlay">
                        <span>INDISPONÍVEL</span>
                    </div>

                </div>

                <div class="product-details">

                    <p class="product-code">Ref. 000</p>

                    <p class="price">R$ 159,90</p>

                </div>

            </article>





        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-content">

            <div class="footer-logo">

                <img
                    src="../img/logo1.png"
                    alt="GIORNNO Joias">

            </div>


            <div class="footer-divider"></div>


            <div class="contact">

                <h3>ATENDIMENTO</h3>

                <p>✉ @semijoiasbyfahelen</p>

            </div>

        </div>

    </footer>


    <!-- MODAL DO PRODUTO -->

    <div
        class="product-modal"
        id="productModal">

        <div class="modal-overlay"></div>


        <div class="modal-content">

            <button
                class="modal-close"
                id="modalClose"
                aria-label="Fechar">

                ×

            </button>


            <div class="modal-image">

                <img
                    id="modalProductImage"
                    src=""
                    alt="">

            </div>


            <div class="modal-info">

                <p class="modal-category">

                    GIORNNO JOIAS

                </p>


                <h2 id="modalProductName">

                    CONJUNTO

                </h2>


                <p
                    class="modal-ref"
                    id="modalProductRef">

                </p>


                <p
                    class="modal-price"
                    id="modalProductPrice">

                </p>


                <div class="modal-divider"></div>


                <p class="modal-description">

                    Gostou desta peça? Entre em contato conosco
                    para mais informações.

                </p>


                <button
                    class="interest-button"
                    id="interestButton">

                    MANIFESTAR INTERESSE

                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../js/script.js"></script>

</body>

</html>
